apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: noter-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Starting PostgreSQL with custom configuration..."
          exec docker-entrypoint.sh postgres \
            -c max_connections=1000 \
            -c shared_buffers=256MB \
            -c effective_cache_size=768MB \
            -c maintenance_work_mem=64MB \
            -c checkpoint_completion_target=0.7 \
            -c wal_buffers=16MB \
            -c default_statistics_target=100
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - pg_isready -U admin -d fast_api
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - pg_isready -U admin -d fast_api
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: noter-app
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
